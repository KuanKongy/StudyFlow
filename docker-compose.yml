services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ./api
      target: development
    ports:
      - "4000:4000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    env_file:
      - ./api/src/.env
    environment:
      - MONGO_URL=mongodb://mongo:27017/study
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis

  worker:
    build:
      context: ./worker
      target: development
    volumes:
      - ./worker:/app
      - worker_node_modules:/app/node_modules
    env_file:
      - ./worker/.env
    environment:
      - MONGO_URL=mongodb://mongo:27017/study
      - REDIS_URL=redis://redis:6379
      # Optional: point to local 429 stub for tests/redbar/ai-001-backoff.test.mjs (e.g. http://host.docker.internal:19723/v1)
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data:
  api_node_modules:
  worker_node_modules:
