<!doctype html>
<!-- Source for frontend/public/og-image.png (1200x630). See docs/og-image.md for how to regenerate. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, hsl(222, 47%, 11%) 0%, hsl(221, 83%, 25%) 100%);
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
    overflow: hidden;
  }

  /* soft glows echoing the brand gradient */
  .glow-blue, .glow-violet {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
  }
  .glow-blue  { width: 560px; height: 560px; right: -140px; top: -180px; background: rgba(37, 99, 235, 0.35); }
  .glow-violet{ width: 480px; height: 480px; right: 120px; bottom: -240px; background: rgba(124, 58, 237, 0.28); }

  /* big translucent book watermark on the right */
  .watermark {
    position: absolute;
    right: 64px;
    top: 130px;
    width: 400px;
    height: 400px;
    opacity: 0.14;
  }

  .content {
    position: relative;
    height: 100%;
    padding: 64px 72px 56px;
    display: flex;
    flex-direction: column;
  }

  .brand { display: flex; align-items: center; gap: 20px; }
  .logo-tile {
    width: 76px; height: 76px;
    border-radius: 17px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 32px rgba(37, 99, 235, 0.45);
  }
  .logo-tile svg { width: 46px; height: 46px; }
  .wordmark { font-size: 44px; font-weight: 800; letter-spacing: -0.5px; }

  .headline {
    margin-top: 62px;
    font-size: 92px;
    font-weight: 800;
    line-height: 1.06;
    letter-spacing: -2.5px;
  }
  .headline .grad {
    background: linear-gradient(100deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subline {
    margin-top: 26px;
    font-size: 28px;
    font-weight: 500;
    line-height: 1.45;
    color: rgba(255, 255, 255, 0.78);
  }

  .features { margin-top: auto; display: flex; gap: 44px; }
  .feature { display: flex; align-items: center; gap: 14px; }
  .feature-icon {
    width: 52px; height: 52px;
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.12);
    display: flex; align-items: center; justify-content: center;
  }
  .feature-icon svg { width: 26px; height: 26px; }
  .feature span { font-size: 24px; font-weight: 600; color: rgba(255, 255, 255, 0.88); }
</style>
</head>
<body>
<div class="card">
  <div class="glow-blue"></div>
  <div class="glow-violet"></div>

  <svg class="watermark" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 7v14"/>
    <path d="M3 18a1 1 0 0 1-1-1V5a2 2 0 0 1 2-2h5a3 3 0 0 1 3 3v15a3 3 0 0 0-3-3Z"/>
    <path d="M21 18a1 1 0 0 0 1-1V5a2 2 0 0 0-2-2h-5a3 3 0 0 0-3 3v15a3 3 0 0 1 3-3Z"/>
  </svg>

  <div class="content">
    <div class="brand">
      <div class="logo-tile">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 7v14"/>
          <path d="M3 18a1 1 0 0 1-1-1V5a2 2 0 0 1 2-2h5a3 3 0 0 1 3 3v15a3 3 0 0 0-3-3Z"/>
          <path d="M21 18a1 1 0 0 0 1-1V5a2 2 0 0 0-2-2h-5a3 3 0 0 0-3 3v15a3 3 0 0 1 3-3Z"/>
        </svg>
      </div>
      <div class="wordmark">StudyFlow</div>
    </div>

    <div class="headline">Study smarter,<br /><span class="grad">together.</span></div>

    <div class="subline">Collaborative study groups, shared notes,<br />and AI-generated summaries &amp; flashcards.</div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <span>Study Groups</span>
      </div>
      <div class="feature">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
            <path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>
          </svg>
        </div>
        <span>AI Summaries</span>
      </div>
      <div class="feature">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
            <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
            <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
            <path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/>
            <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/>
            <path d="M3.477 10.896a4 4 0 0 1 .585-.396"/>
            <path d="M19.938 10.5a4 4 0 0 1 .585.396"/>
            <path d="M6 18a4 4 0 0 1-1.967-.516"/>
            <path d="M19.967 17.484A4 4 0 0 1 18 18"/>
          </svg>
        </div>
        <span>Smart Flashcards</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
