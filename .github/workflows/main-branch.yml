# Archived AWS entry point. It is intentionally manual-only while the project
# migrates to Railway + Vercel.

name: Archived AWS main branch pipeline

on:
  workflow_dispatch:

concurrency:
  group: studyflow-main-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build-images:
    if: ${{ vars.ENABLE_AWS_CICD == 'true' }}
    uses: ./.github/workflows/build-images.yml
    secrets: inherit

  deploy-frontend:
    if: ${{ vars.ENABLE_AWS_CICD == 'true' }}
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit

  deploy-terraform:
    if: ${{ vars.ENABLE_AWS_CICD == 'true' }}
    needs: [build-images, deploy-frontend]
    uses: ./.github/workflows/deploy-terraform.yml
    secrets: inherit
