name: Deploy frontend to S3

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1
  TF_WORKING_DIR: terraform
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Read Terraform outputs
        id: tf
        run: |
          echo "bucket=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw frontend_cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        env:
          VITE_AUTH0_DOMAIN: ${{ secrets.FRONTEND_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.FRONTEND_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.FRONTEND_AUTH0_AUDIENCE }}
        run: |
          npm ci
          npm run build

      - name: Sync to S3
        env:
          BUCKET: ${{ steps.tf.outputs.bucket }}
        run: aws s3 sync frontend/dist/ "s3://${BUCKET}/" --delete

      - name: Invalidate CloudFront cache
        env:
          DIST_ID: ${{ steps.tf.outputs.distribution }}
        run: aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
